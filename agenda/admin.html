<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Administrar agenda · Medios y Cultura Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Inicio de sesión -->
  <div class="wrap" id="login-view" hidden>
    <form class="card login form" id="login-form">
      <div>
        <h1>Administrar agenda</h1>
        <p>Entra con tu cuenta del departamento.</p>
      </div>
      <label class="field"><span>Correo</span>
        <input class="input" id="login-email" type="email" autocomplete="username" required>
      </label>
      <label class="field"><span>Contraseña</span>
        <input class="input" id="login-password" type="password" autocomplete="current-password" required>
      </label>
      <p class="msg" id="login-msg" hidden></p>
      <button class="btn primary" id="login-submit" type="submit">Entrar</button>
      <a href="index.html" style="font-size:.9rem;text-align:center">Volver a la agenda</a>
    </form>
  </div>

  <!-- Sin permiso -->
  <div class="wrap" id="denied-view" hidden>
    <div class="card login form">
      <div>
        <h1>Sin permiso</h1>
        <p>Tu cuenta <strong id="denied-email"></strong> no está autorizada para editar la agenda. Pide acceso a quien administra el sitio.</p>
      </div>
      <button class="btn" type="button" id="denied-logout">Cerrar sesión</button>
    </div>
  </div>

  <!-- Panel -->
  <div class="wrap" id="panel-view" hidden>
    <div class="admin-top">
      <div>
        <p class="dept">Medios y Cultura Digital</p>
        <h1>Eventos</h1>
      </div>
      <div class="actions">
        <a class="btn" href="index.html" target="_blank" rel="noopener">Ver agenda</a>
        <button class="btn" type="button" id="logout">Cerrar sesión</button>
        <button class="btn primary" type="button" id="new-event">+ Nuevo evento</button>
      </div>
    </div>
    <div id="list"><p class="state">Cargando eventos…</p></div>
    <div style="height:64px"></div>
  </div>

  <!-- Formulario de evento -->
  <dialog id="editor" aria-labelledby="editor-title">
    <form class="sheet form" id="event-form" novalidate>
      <div class="sheet-top">
        <h2 id="editor-title" style="font-size:1.4rem">Nuevo evento</h2>
        <button type="button" class="close" id="editor-close" aria-label="Cerrar">✕</button>
      </div>

      <label class="field"><span>Título</span>
        <input class="input" id="f-title" maxlength="160" required placeholder="Ej. Taller de edición de video">
      </label>

      <div class="row">
        <label class="field"><span>Tipo</span>
          <select class="input" id="f-category"></select>
        </label>
        <label class="field"><span>Lugar</span>
          <input class="input" id="f-location" placeholder="Ej. Sala de proyección, Aulas 4">
        </label>
      </div>

      <div class="row">
        <label class="field"><span>Fecha</span>
          <input class="input" id="f-date" type="date" required>
        </label>
        <label class="field" id="w-start"><span>Empieza</span>
          <input class="input" id="f-start" type="time">
        </label>
        <label class="field" id="w-end"><span>Termina <small>(opcional)</small></span>
          <input class="input" id="f-end" type="time">
        </label>
      </div>

      <div class="row">
        <label class="check"><input type="checkbox" id="f-allday"> Dura todo el día</label>
        <label class="field"><span>Último día <small>(si dura varios)</small></span>
          <input class="input" id="f-enddate" type="date">
        </label>
      </div>

      <label class="field"><span>Descripción</span>
        <textarea class="input" id="f-description" placeholder="¿De qué trata? ¿Quién lo imparte? ¿Hay que llevar algo?"></textarea>
      </label>

      <label class="field"><span>Enlace de inscripción <small>(opcional)</small></span>
        <input class="input" id="f-signup" type="url" inputmode="url" placeholder="https://…">
      </label>

      <div class="field"><span>Imagen o afiche <small>(opcional)</small></span>
        <div class="upload">
          <img id="f-preview" alt="" hidden>
          <input id="f-image" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
          <button type="button" class="btn small danger" id="f-remove-image" hidden>Quitar imagen</button>
        </div>
      </div>

      <label class="check"><input type="checkbox" id="f-published" checked> Visible para los alumnos</label>

      <p class="msg" id="form-msg" hidden></p>
      <div class="actions">
        <button class="btn primary" id="save" type="submit">Publicar evento</button>
        <button class="btn" type="button" id="cancel">Cancelar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
